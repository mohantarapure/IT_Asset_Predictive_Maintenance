{% extends 'base.html' %}{% block content %}<h1>Asset Readings</h1><form class='panel formgrid' method=post><label>Asset<select name=asset_id required>{% for a in assets %}<option value={{a.asset_id}}>{{a.asset_name}} ({{a.asset_tag}})</option>{% endfor %}</select></label><label>Date<input type=date name=reading_date required value={{today}}></label><label>CPU usage %<input type=number step=.1 min=0 max=100 name=cpu_usage required></label><label>Memory usage %<input type=number step=.1 min=0 max=100 name=memory_usage required></label><label>Temperature °C<input type=number step=.1 min=0 name=temperature required></label><label>Disk usage %<input type=number step=.1 min=0 max=100 name=disk_usage required></label><label>Uptime hours<input type=number step=.1 min=0 name=uptime_hours required></label><label>Error count<input type=number min=0 name=error_count required></label><button>Save Reading</button></form><section class=panel><table><tr><th>Date</th><th>Asset</th><th>CPU</th><th>Memory</th><th>Temp</th><th>Errors</th></tr>{% for x in rows %}<tr><td>{{x.reading_date}}</td><td>{{x.asset_name}}</td><td>{{x.cpu_usage}}%</td><td>{{x.memory_usage}}%</td><td>{{x.temperature}}</td><td>{{x.error_count}}</td></tr>{% endfor %}</table></section>{% endblock %}
