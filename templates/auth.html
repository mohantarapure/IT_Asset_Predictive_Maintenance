{% extends 'base.html' %}{% block content %}<section class=auth><h1>IT Asset & Predictive Maintenance</h1><div class=panel><h2>{{'Create account' if register else 'Welcome back'}}</h2><form method=post>{% if register %}<label>Name<input name=name required></label>{% endif %}<label>Email<input type=email name=email required></label><label>Password<input type=password name=password required></label><button>{{'Register' if register else 'Login'}}</button></form><p>{% if register %}Already registered? <a href='{{url_for("login")}}'>Login</a>{% else %}New user? <a href='{{url_for("register")}}'>Register</a>{% endif %}</p><small>Demo: demo@example.com / demo123</small></div></section>{% endblock %}
