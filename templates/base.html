<!doctype html><html><head><meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1'><title>IT Asset PM</title><link rel=stylesheet href='{{url_for("static",filename="css/style.css")}}'><script src='https://cdn.jsdelivr.net/npm/chart.js'></script></head><body><nav><a class=brand href='{{url_for("dashboard")}}'>IT Asset PM</a>{% if user %}<a href='{{url_for("assets")}}'>Assets</a><a href='{{url_for("maintenance")}}'>Maintenance</a><a href='{{url_for("failures")}}'>Failures</a><a href='{{url_for("schedule")}}'>Schedule</a><a href='{{url_for("readings")}}'>Readings</a><a href='{{url_for("analytics")}}'>Analytics</a><a href='{{url_for("masters")}}'>Master Data</a><span class=navuser>{{user['name']}} · <a href='{{url_for("logout")}}'>Logout</a></span>{% endif %}</nav><main>{% with msgs=get_flashed_messages(with_categories=true) %}{% for cat,msg in msgs %}<div class='flash {{cat}}'>{{msg}}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main><script src='{{url_for("static",filename="js/script.js")}}'></script></body></html>
