{% extends 'base.html' %}{% block content %}<h1>Maintenance Schedule</h1><form class='panel formgrid' method=post><label>Asset<select name=asset_id required>{% for a in assets %}<option value={{a.asset_id}}>{{a.asset_name}} ({{a.asset_tag}})</option>{% endfor %}</select></label><label>Scheduled date<input type=date name=scheduled_date required></label><label>Type<select name=maintenance_type><option>Preventive</option><option>Corrective</option><option>Emergency</option></select></label><label>Status<select name=status><option>Scheduled</option><option>Pending</option><option>Completed</option></select></label><label>Notes<input name=notes></label><button>Save Schedule</button></form><section class=panel><table><tr><th>Date</th><th>Asset</th><th>Type</th><th>Status</th><th>Notes</th></tr>{% for x in rows %}<tr><td>{{x.scheduled_date}}</td><td>{{x.asset_name}}</td><td>{{x.maintenance_type}}</td><td>{{x.status}}</td><td>{{x.notes}}</td></tr>{% endfor %}</table></section>{% endblock %}
