{% extends 'base.html' %}{% block content %}<div class=heading><h1>Failure Records</h1><a class=button href='{{url_for("export",kind="failures")}}'>Export CSV</a></div><form class='panel formgrid' method=post><label>Asset<select name=asset_id required>{% for a in assets %}<option value={{a.asset_id}}>{{a.asset_name}} ({{a.asset_tag}})</option>{% endfor %}</select></label><label>Failure Date<input type=date name=failure_date required value={{today}}></label><label>Failure Type<input name=failure_type required placeholder='Disk, network, power...'></label><label>Severity<select name=severity>{% for x in ['Low','Medium','High','Critical'] %}<option>{{x}}</option>{% endfor %}</select></label><label>Downtime Hours<input type=number step=.1 min=0 name=downtime_hours required></label><label>Repair Cost<input type=number step=.01 min=0 name=repair_cost required></label><label>Description<input name=description required></label><button>Add Failure</button></form><section class=panel><table><tr><th>Date</th><th>Asset</th><th>Type</th><th>Severity</th><th>Downtime</th><th>Repair Cost</th></tr>{% for x in rows %}<tr><td>{{x.failure_date}}</td><td>{{x.asset_name}}</td><td>{{x.failure_type}}</td><td>{{x.severity}}</td><td>{{x.downtime_hours}}</td><td>{{x.repair_cost}}</td></tr>{% endfor %}</table></section>{% endblock %}
