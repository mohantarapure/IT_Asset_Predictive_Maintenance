{% extends 'base.html' %}{% block content %}<div class=heading><h1>Maintenance Management</h1><a class=button href='{{url_for("export",kind="maintenance")}}'>Export CSV</a></div><form class='panel formgrid' method=post><label>Asset<select name=asset_id required>{% for a in assets %}<option value={{a.asset_id}}>{{a.asset_name}} ({{a.asset_tag}})</option>{% endfor %}</select></label><label>Type<select name=maintenance_type><option>Preventive</option><option>Corrective</option><option>Emergency</option></select></label><label>Date<input type=date name=maintenance_date required value={{today}}></label><label>Technician<input name=technician required></label><label>Cost<input type=number step=.01 min=0 name=cost required></label><label>Downtime hours<input type=number step=.1 min=0 name=downtime_hours required></label><label>Status<select name=status><option>Completed</option><option>Scheduled</option><option>Pending</option></select></label><label>Description<input name=description required></label><button>Add Record</button></form><section class=panel><table><tr><th>Date</th><th>Asset</th><th>Type</th><th>Technician</th><th>Cost</th><th>Status</th><th></th></tr>{% for x in rows %}<tr><td>{{x.maintenance_date}}</td><td>{{x.asset_name}}</td><td>{{x.maintenance_type}}</td><td>{{x.technician}}</td><td>{{x.cost}}</td><td>{{x.status}}</td><td><form method=post action='{{url_for("delete_maintenance",id=x.maintenance_id)}}'><button class=link>Delete</button></form></td></tr>{% endfor %}</table></section>{% endblock %}
