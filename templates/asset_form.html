{% extends 'base.html' %}{% block content %}<h1>{{'Edit' if asset else 'Add'}} Asset</h1><form class=panel formgrid method=post><label>Asset Name<input name=asset_name required value='{{asset.asset_name if asset else ""}}'></label><label>Asset Tag<input name=asset_tag required value='{{asset.asset_tag if asset else ""}}'></label><label>Category<select name=category_id required>{% for c in categories %}<option value={{c.category_id}} {% if asset and asset.category_id==c.category_id %}selected{% endif %}>{{c.category_name}}</option>{% endfor %}</select></label><label>Manufacturer<input name=manufacturer value='{{asset.manufacturer if asset else ""}}'></label><label>Model<input name=model value='{{asset.model if asset else ""}}'></label><label>Purchase Date<input type=date name=purchase_date required value='{{asset.purchase_date if asset else ""}}'></label><label>Warranty Expiry<input type=date name=warranty_expiry value='{{asset.warranty_expiry if asset else ""}}'></label><label>Installation Date<input type=date name=installation_date value='{{asset.installation_date if asset else ""}}'></label><label>Location<input name=location required value='{{asset.location if asset else ""}}'></label><label>Status<select name=status>{% for x in ['Active','Under Maintenance','Retired'] %}<option {{'selected' if asset and asset.status==x}}>{{x}}</option>{% endfor %}</select></label><label>Criticality<select name=criticality>{% for x in ['Low','Medium','High'] %}<option {{'selected' if asset and asset.criticality==x}}>{{x}}</option>{% endfor %}</select></label><div><button>Save Asset</button> <a class=button secondary href='{{url_for("assets")}}'>Cancel</a></div></form>{% endblock %}
