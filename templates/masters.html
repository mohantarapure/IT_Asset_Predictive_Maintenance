{% extends 'base.html' %}{% block content %}<h1>Master Data</h1><form class='panel inlineform' method=post><input name=category_name placeholder='New category' required><button>Add Category</button></form><section class=panel><table><tr><th>Category</th><th>Assets using it</th><th>Action</th></tr>{% for x in categories %}<tr><td>{{x.category_name}}</td><td>{{x.used}}</td><td>{% if not x.used %}<form method=post action='{{url_for("delete_master",id=x.category_id)}}'><button class=link>Delete</button></form>{% else %}<span class=muted>Protected by foreign key</span>{% endif %}</td></tr>{% endfor %}</table></section>{% endblock %}
